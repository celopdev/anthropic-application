name: CI/CD

on:
  push:
    branches: [main]

jobs:
  tests:
    name: CI
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  bump:
    name: CD
    needs: tests
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump type from commit message
        id: bump
        run: |
          MSG="${{ github.event.head_commit.message }}"
          echo "Commit: $MSG"
          if echo "$MSG" | grep -qE "^feat[^!]*!:|BREAKING CHANGE"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qE "^feat(\(.+\))?:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qE "^(fix|refactor|docs|style|perf|test|ci|build|chore)(\(.+\))?:"; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=none" >> $GITHUB_OUTPUT
          fi

      - name: Bump version in plugin.json
        if: steps.bump.outputs.type != 'none'
        run: python3 .github/scripts/bump-version.py ${{ steps.bump.outputs.type }}

      - name: Commit and push
        if: steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(python3 -c "import json; d=json.load(open('.claude-plugin/marketplace.json')); print(next(p for p in d['plugins'] if p['name']=='celestin')['version'])")
          git add .claude-plugin/marketplace.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push
